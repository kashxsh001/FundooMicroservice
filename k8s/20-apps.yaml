apiVersion: v1
kind: ConfigMap
metadata:
  name: fundoo-config
data:
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_HTTP_PORTS: "8080"
  Jwt__Issuer: fundoo-user-api
  Jwt__Audience: fundoo-clients
  ConnectionStrings__Redis: redis:6379,abortConnect=false
  Kafka__BootstrapServers: kafka:9092
  Kafka__Topic: fundoo.note-events
  NotificationService__BaseUrl: http://notification-api:8080/
  ReverseProxy__Clusters__user-cluster__Destinations__user-api__Address: http://user-api:8080/
  ReverseProxy__Clusters__notes-cluster__Destinations__notes-api__Address: http://notes-api:8080/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-api }
  template:
    metadata:
      labels: { app: user-api }
    spec:
      containers:
        - name: user-api
          image: kashxsh001/fundoo-user:live
          imagePullPolicy: Always
          command: ["dotnet"]
          args: ["Fundoo.User.Api.dll"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: fundoo-config }
          env:
            - name: ConnectionStrings__UserDb
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: USER_DB_CONNECTION } }
            - name: Jwt__SigningKey
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: JWT_SIGNING_KEY } }
            - name: Google__ClientId
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: GOOGLE_CLIENT_ID } }
            - name: Google__ClientSecret
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: GOOGLE_CLIENT_SECRET } }
            - name: ServiceAuth__SigningKey
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: SERVICE_AUTH_SIGNING_KEY } }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 750m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-api
spec:
  selector: { app: user-api }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
