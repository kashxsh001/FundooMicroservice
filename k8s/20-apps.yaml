apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-api }
  template:
    metadata:
      labels: { app: notification-api }
    spec:
      containers:
        - name: notification-api
          image: kashxsh001/fundoo-notification:live
          imagePullPolicy: Always
          command: ["dotnet"]
          args: ["Fundoo.Notification.Api.dll"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: fundoo-config }
          env:
            - name: ServiceAuth__SigningKey
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: SERVICE_AUTH_SIGNING_KEY } }
            - name: EmailSettings__Host
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: SMTP_HOST } }
            - name: EmailSettings__Port
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: SMTP_PORT } }
            - name: EmailSettings__SenderEmail
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: SMTP_SENDER_EMAIL } }
            - name: EmailSettings__Username
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: SMTP_USERNAME } }
            - name: EmailSettings__Password
              valueFrom: { secretKeyRef: { name: fundoo-secrets, key: SMTP_PASSWORD } }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-api
spec:
  selector: { app: notification-api }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: kashxsh001/fundoo-gateway:live
          imagePullPolicy: Always
          command: ["dotnet"]
          args: ["Fundoo.ApiGateway.dll"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: fundoo-config }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - { name: http, port: 80, targetPort: 8080, nodePort: 30080 }
